spring.application.name=jwt-auth-demo
server.port=8080

# ---------- Database (H2 in-memory, zero setup) ----------
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.username=sa
spring.datasource.password=
# H2 web console kept OFF: in Spring Security 6 an extra servlet makes
# requestMatchers("/path") ambiguous and the app fails to start.
spring.h2.console.enabled=false

# ---------- MySQL (swap in if interviewer asks) ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- JWT ----------
# Base64-encoded 256-bit secret (HS256 needs >= 32 bytes).
# In real projects: read from env variable / vault, NEVER commit it.
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWp3dC1kZW1vLTEyMzQ1Ng==}
# Access token: 15 minutes
app.jwt.access-expiration-ms=900000
# Refresh token: 7 days
app.jwt.refresh-expiration-ms=604800000
